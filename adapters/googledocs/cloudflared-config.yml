# Callosum — cloudflared named-tunnel config for callosum.clffwrkmn.net (inc 169, Google Docs SP1).
#
# CITE-ONLY ingress: forward ONLY the citation endpoints the Google Docs add-on uses to local callosum; everything
# else → 404. This is the tunnel-side boundary (the bearer token from Settings → Remote access is callosum's
# boundary). The allowlist is what keeps the app shell, /settings, the scan routes, and /papers/{id} edit/delete
# UNREACHABLE through the tunnel — even though they exist locally.
#
# Fill in <TUNNEL_ID> + the credentials path from `cloudflared tunnel create callosum` (see README.md). On Windows
# the credentials file is typically C:\Users\<you>\.cloudflared\<TUNNEL_ID>.json.

tunnel: <TUNNEL_ID>
credentials-file: <HOME>/.cloudflared/<TUNNEL_ID>.json

ingress:
  # cite-only: GET /papers (search), POST /papers/export, POST /citations/render-document, /citations/suggest,
  # GET /citations/styles. Query strings (e.g. /papers?q=) are not part of the path match.
  - hostname: callosum.clffwrkmn.net
    path: ^/(papers|papers/export|citations/render-document|citations/suggest|citations/styles)$
    service: http://localhost:8080
  # everything else on the hostname → 404 (the app shell, /settings, scan routes, /papers/{id} edit/delete, …)
  - hostname: callosum.clffwrkmn.net
    service: http_status:404
  # required catch-all
  - service: http_status:404
