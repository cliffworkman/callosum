<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Callosum Citations</title>
  <!-- office.js is Microsoft's Office platform SDK (required for any add-in); the rest is served by callosum same-origin -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css"/>
  <script src="taskpane_core.js"></script>
</head>
<body>
  <div id="app" style="display:none">
    <h1>Callosum citations</h1>
    <div id="tunnel" class="tunnel" style="display:none">
      <label class="field">Access token (Settings → Remote access, on your machine)
        <input id="tunnelToken" type="password" placeholder="Paste your access token…" autocomplete="off" aria-label="Callosum access token"/>
      </label>
      <button id="tunnelSave" type="button" class="secondary">Save token</button>
    </div>
    <label class="field">Citation style
      <select id="style" aria-label="Citation style"></select>
    </label>

    <p class="hint">Search to add a work to the citation you're building:</p>
    <input id="q" type="search" placeholder="Search author, title, year…" autocomplete="off" aria-label="Search your library"/>
    <ul id="results" class="results"></ul>

    <p class="hint">…or let Callosum suggest from the sentence you're writing:</p>
    <div class="actions">
      <button id="suggest" type="button" class="secondary">Suggest from the sentence</button>
    </div>
    <ul id="suggestions" class="results"></ul>

    <div id="assemblySection" class="assembly" style="display:none">
      <p class="hint">Citation you're building — add more works above, reorder, or set a locator/prefix/suffix:</p>
      <ul id="assembly" class="assembly-list"></ul>
      <div class="actions">
        <button id="insertCitation" type="button" class="refresh">Insert citation</button>
        <button id="cancelAssembly" type="button" class="secondary">Cancel</button>
      </div>
    </div>

    <div class="actions">
      <button id="editAtCursor" type="button" class="secondary">Edit citation at cursor</button>
      <button id="deleteAtCursor" type="button" class="secondary">Delete citation at cursor</button>
    </div>

    <div class="actions">
      <button id="refresh" type="button" class="refresh">Refresh / renumber + bibliography</button>
      <button id="flatten" type="button" class="secondary">Flatten to static text</button>
    </div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
  </div>
  <noscript>This add-in requires JavaScript.</noscript>
  <script src="taskpane.js"></script>
</body>
</html>
