name: P1 packaged-model qualification (Windows)

# Qualifies P1 only: the recovered, signed Windows packaged runtime loads the pinned Arctic S and DeBERTa checkpoints
# through the application's own provisioning, resolvers and contract checks, offline, with frozen parity. It does not
# close P1b, P2, P3, P4, macOS/Linux, issue #110, the security review or the 0.6.0 release gate.
#
# Trigger: a push to the dedicated qualification branch only. Nothing on main, no tags, no pull requests, no schedule.
# workflow_dispatch is deliberately absent: it would require this file on the default branch.
on:
  push:
    branches: ["qualify/p1-0.6.0"]

permissions:
  contents: read

concurrency:
  group: p1-qualification
  cancel-in-progress: false

jobs:
  p1:
    if: github.repository == 'cliffworkman/callosum' && github.ref == 'refs/heads/qualify/p1-0.6.0'
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the driver proves the app tree equals the qualification base commit
          persist-credentials: false

      - name: Run P1 qualification (single attempt, no retries)
        id: p1
        run: >-
          pwsh -NoProfile -File tools/qualification/p1/p1_qualify.ps1
          -Repo "$env:GITHUB_WORKSPACE" -Work "$env:RUNNER_TEMP\p1"

      - name: Remove qualification firewall rules
        if: always()
        run: |
          Get-NetFirewallRule -Group 'callosum-p1-qualification' -ErrorAction SilentlyContinue | Remove-NetFirewallRule
          $left = @(Get-NetFirewallRule -Group 'callosum-p1-qualification' -ErrorAction SilentlyContinue).Count
          "firewall rules left in the qualification group: $left"
          if ($left) { exit 1 }

      - name: Preserve receipt and phase outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p1/out
          if-no-files-found: error
          retention-days: 90
