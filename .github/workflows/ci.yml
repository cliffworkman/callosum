name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: |
          uv sync --locked
          npm ci
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Line budget (rule #1 — 600-line cap on app/ + integrations/)
        run: uv run python tools/check_line_budget.py
      - name: "Alembic migration check (fresh temp DB: upgrade head + zero model/migration drift)"
        run: uv run pytest tests/test_migrations.py -q
      - name: pip-audit (runtime dependencies — requirements.txt)
        run: uv run pip-audit -r requirements.txt --strict
      - name: "pip-audit (dev dependencies — report-only; see requirements-dev.txt for the one accepted finding)"
        run: uv run pip-audit -r requirements-dev.txt || true
      - name: Pytest (offline suite; parallel via pytest-xdist; the browser e2e is opt-in and runs in the job below)
        run: uv run pytest -n auto -q
      - name: QA surface-coverage check (report-only until the route suite is green; inc 120)
        run: uv run python tools/qa/build_surface_map.py check || true

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: |
          uv sync --locked
          npm ci
      - name: Install Chromium for Playwright
        run: uv run playwright install --with-deps chromium
      - name: Browser smoke (loads the app, asserts zero console errors)
        env:
          CALLOSUM_RUN_E2E: "1"
        run: uv run pytest tests/e2e -q
