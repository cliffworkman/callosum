name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          npm ci
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Pytest (offline suite; the browser e2e is opt-in and runs in the job below)
        run: pytest -q
      - name: QA surface-coverage check (report-only until the route suite is green; inc 120)
        run: python tools/qa/build_surface_map.py check || true

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          npm ci
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: Browser smoke (loads the app, asserts zero console errors)
        env:
          CALLOSUM_RUN_E2E: "1"
        run: pytest tests/e2e -q
