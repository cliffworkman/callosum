name: Desktop shell (Linux)

# Builds the Tauri desktop shell as a Linux .deb (x86_64) and verifies it on the runner. This is new
# platform scope (backlog #21 originally targeted only Windows/macOS for the one known adopter) --
# added because Cliff wants a Linux build to exist, not because a specific user is waiting on it;
# treat any Linux-specific rough edges here as genuinely less proven than the Windows/macOS paths.
#
# .deb only, not AppImage: Tauri's AppImage bundler shells out to linuxdeploy, which walks the FULL
# ELF dependency graph of every bundled binary before it'll package anything. Against this project's
# actual dependency stack (a complete embedded CPython + torch/scipy/numpy/scikit-learn) that surfaced
# an escalating series of real, separate failures on real runs: linuxdeploy is itself an AppImage
# needing FUSE (ubuntu-latest doesn't reliably have it); torch's default wheel links the NVIDIA
# driver's libcuda.so.1, absent on any GPU-less machine; torch bundles its own internal C++ test-suite
# binaries with rpaths linuxdeploy can't always follow; and scipy/scikit-learn each vendor their own
# uniquely-hashed copies of libgfortran/libquadmath (a standard auditwheel pattern) that don't
# cross-resolve the way linuxdeploy expects. The .deb bundler is a separate, much simpler pipeline
# (declare dependencies, copy files) that doesn't do any of this — it sidesteps the whole class of
# problem rather than chasing it fix-by-fix, and .deb is genuinely what most desktop Linux users can
# install directly anyway (Debian/Ubuntu and derivatives).
#
# ubuntu-latest has NO display server by default (unlike the Windows/macOS runners, which keep a real
# interactive session) — this workflow starts a virtual framebuffer (Xvfb) specifically so the real
# app can actually render, and screenshots it.
#
# The independently versioned Python environment is built by desktop-python-runtime.yml only when
# its input-derived runtime ID changes; this ordinary .deb build never rebuilds or bundles it.

on:
  workflow_dispatch: {}
  workflow_call: {} # called by desktop-shell-release.yml on a pushed version tag; branch-push path below unaffected
  push:
    branches: [main]
    paths:
      - "app/desktop-shell/**"
      - "app/backend/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/desktop-shell-linux.yml"

concurrency:
  # A hardcoded literal, not ${{ github.workflow }} -- when called via workflow_call from
  # desktop-shell-release.yml, github.workflow can resolve to the CALLER's name, which would collide all
  # three platforms' concurrency groups and cancel each other out via cancel-in-progress.
  group: desktop-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-shell:
    # Build at the supported glibc floor, matching desktop-python-runtime.yml. `ubuntu-latest` is now
    # Ubuntu 24.04 (glibc 2.39), and Rust std's process spawning pulls in pidfd_spawnp/pidfd_getpid
    # from 2.39 -- so a shell built there cannot start at all on Debian 12 (2.36) or Ubuntu 22.04
    # (2.35). That is backlog #71, confirmed on a real Debian 12 box: the loader refuses the binary
    # outright, which is why the app "installs but never opens".
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: "Guard: on a tag push, the tag version must match tauri.conf.json/Cargo.toml/package.json"
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -e
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CONF=$(jq -r '.version' app/desktop-shell/src-tauri/tauri.conf.json)
          CARGO=$(grep -m1 '^version' app/desktop-shell/src-tauri/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          PKG=$(jq -r '.version' app/desktop-shell/package.json)
          if [ "$TAG_VERSION" != "$CONF" ] || [ "$TAG_VERSION" != "$CARGO" ] || [ "$TAG_VERSION" != "$PKG" ]; then
            echo "::error::tag v$TAG_VERSION does not match tauri.conf.json=$CONF, Cargo.toml=$CARGO, package.json=$PKG"
            exit 1
          fi
          echo "tag v$TAG_VERSION matches tauri.conf.json/Cargo.toml/package.json"

      - name: Install Tauri's Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb \
            imagemagick

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/desktop-shell/src-tauri
          # rust-cache's default key is only "Linux-x64", which does not distinguish Ubuntu 22.04
          # from 24.04. Moving this job to the glibc floor therefore restored artifacts compiled on
          # 24.04 into a 22.04 runner, and the build failed with "can't find crate for `tauri`".
          #
          # This must be prefix-key, not key: restore-keys match by PREFIX, so a differing suffix
          # still matches an old cache (observed -- `key: ${{ env.ImageOS }}` changed nothing, both
          # because env.* in a `with:` expression sees only workflow-declared env maps and never
          # runner variables like ImageOS, and because a suffix cannot prevent a prefix match).
          # prefix-key leads both the key and the restore-keys, so v1- can never restore a v0- cache.
          prefix-key: v1-rust-jammy

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Verify referenced immutable Python runtime is published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ID=$(python app/desktop-shell/packaging/package_python_runtime.py id --platform linux-x86_64)
          ASSETS=$(gh release view "python-runtime-$ID" --json assets --jq '.assets[].name')
          grep -Fx "$ID.tar.gz" <<<"$ASSETS"
          grep -Fx "runtime-manifest.json" <<<"$ASSETS"
          grep -Fx "runtime-manifest.json.sig" <<<"$ASSETS"

      - name: Install project dependencies (needed just to import app.backend for build_frontend.py)
        run: uv sync --locked

      - name: Install frontend build toolchain + build callosum-app.html
        run: |
          npm install
          uv run python tools/build_frontend.py

      - name: Stage callosum source into resources/callosum-src
        run: python3 app/desktop-shell/packaging/stage_source.py

      - name: Install Tauri CLI
        working-directory: app/desktop-shell
        run: npm install

      - name: Build the .deb
        working-directory: app/desktop-shell
        run: npx tauri build

      - name: "Guard: the shell must not require a newer glibc than we support (REQUIRED — blocking)"
        shell: bash
        run: |
          set -euo pipefail
          FLOOR=2.35   # Ubuntu 22.04; Debian 12 is 2.36, so this covers both
          BIN=app/desktop-shell/src-tauri/target/release/callosum-shell
          MAX=$(objdump -T "$BIN" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "highest required glibc: $MAX (floor $FLOOR)"
          # Direct regression guard for backlog #71. One cheap command catches the entire class --
          # a binary that cannot load on a supported distro -- without needing a Debian box, which
          # is exactly what was missing when this shipped broken.
          if [ "$(printf '%s\n%s\n' "$FLOOR" "$MAX" | sort -V | tail -1)" != "$FLOOR" ]; then
            echo "::error::callosum-shell requires glibc $MAX but the support floor is $FLOOR."
            objdump -T "$BIN" | grep "GLIBC_$MAX" || true
            exit 1
          fi

      - name: "Guard: the pinned Local AI runtime must not require a newer glibc than we support (REQUIRED — blocking)"
        shell: bash
        run: |
          set -euo pipefail
          FLOOR=2.35
          SRC=app/desktop-shell/src-tauri/src/managed_local_ai/install.rs
          # Read the pins out of the code itself. Restating them here would create a second source
          # of truth that silently drifts the moment the runtime is re-pinned -- and this guard is
          # worth nothing if it checks a build the app no longer downloads.
          BLOCK=$(sed -n '/ubuntu-x64\.tar\.gz/,/^const INSTALL_DIR/p' "$SRC")
          URL=$(printf '%s' "$BLOCK" | grep -oE 'https://[^"]+ubuntu-x64\.tar\.gz' | head -1)
          SHA=$(printf '%s' "$BLOCK" | grep -oE '"[0-9a-f]{64}"' | head -1 | tr -d '"')
          BYTES=$(printf '%s' "$BLOCK" | grep -oE 'RUNTIME_ARCHIVE_BYTES: u64 = [0-9_]+' | grep -oE '[0-9_]+$' | tr -d '_')
          echo "pinned runtime: $URL"

          curl -fsSL "$URL" -o runtime.tar.gz
          echo "$SHA  runtime.tar.gz" | sha256sum -c -
          ACTUAL=$(stat -c%s runtime.tar.gz)
          if [ "$ACTUAL" != "$BYTES" ]; then
            echo "::error::pinned Local AI runtime is $ACTUAL bytes but install.rs declares $BYTES."
            exit 1
          fi

          mkdir -p rt && tar -xzf runtime.tar.gz -C rt
          # Exactly the set the extractor keeps: the launcher plus the runtime libraries.
          mapfile -t SCAN < <(find rt -maxdepth 2 -type f \
            \( -name 'llama-server' -o -name 'libggml*.so*' -o -name 'libllama*.so*' -o -name 'libmtmd*.so*' \))
          echo "scanning ${#SCAN[@]} installed binaries"
          MAX=$(objdump -T "${SCAN[@]}" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "highest required glibc: $MAX (floor $FLOOR)"
          # Same class of failure as backlog #71, one layer further out: a Local AI that installs
          # cleanly and then cannot start is worse than one that was never offered.
          if [ "$(printf '%s\n%s\n' "$FLOOR" "$MAX" | sort -V | tail -1)" != "$FLOOR" ]; then
            echo "::error::the pinned Local AI runtime requires glibc $MAX but the support floor is $FLOOR."
            objdump -T "${SCAN[@]}" | grep "GLIBC_$MAX" || true
            exit 1
          fi
          rm -rf rt runtime.tar.gz

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: callosum-linux-x86_64
          path: app/desktop-shell/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: "Verify: install the real .deb, run it under Xvfb, screenshot the real running window"
        id: verify
        timeout-minutes: 25
        run: |
          set -x
          DEB=$(ls app/desktop-shell/src-tauri/target/release/bundle/deb/*.deb)
          sudo dpkg -i "$DEB"

          Xvfb :99 -screen 0 1280x900x24 &
          export DISPLAY=:99
          sleep 2

          callosum-shell &
          disown

          ready=0
          # A fresh runner intentionally exercises first-use runtime download + verification.
          for i in $(seq 1 400); do
            PORT=$(ps aux | grep -oE "uvicorn app\.backend\.api\.app:app --host 127\.0\.0\.1 --port [0-9]+" | grep -oE "[0-9]+$" | head -1 || true)
            if [ -n "$PORT" ] && [ "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PORT/health" || true)" = "200" ]; then
              echo "healthy on port $PORT after $((i*3))s"
              ready=1
              break
            fi
            sleep 3
          done
          sleep 2  # let the webview actually paint

          import -window root /tmp/running-window.png
          if [ "$ready" != "1" ]; then
            echo "::error::backend never reported healthy within the wait budget"
          fi

          pkill -f callosum-shell 2>/dev/null || true
          if [ "$ready" != "1" ]; then
            find "$HOME/.local/share" -maxdepth 6 -name backend.log -type f \
              -exec sh -c 'echo "--- $1 ---"; tail -n 120 "$1"' _ {} \; || true
            exit 1
          fi

      - name: Upload verification screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: callosum-linux-verification
          path: /tmp/running-window.png
          if-no-files-found: warn
