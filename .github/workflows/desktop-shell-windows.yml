name: Desktop shell (Windows)

# Builds the Tauri desktop shell's Windows NSIS installer and then actually verifies it on the
# runner's real interactive desktop session: installs it silently (the same /S a real user's
# installer run performs, minus the click), launches it, waits for the real bundled backend to
# report healthy, and screenshots the real running window. Windows GitHub-hosted runners keep a
# real interactive session specifically so GUI apps can be exercised this way — this is the closest
# thing to a human click-through available without asking Cliff to do it by hand each time, but it
# is still not a human's eyes on the screen; treat the uploaded screenshot as evidence to review.
#
# The independently versioned Python environment is built by desktop-python-runtime.yml only when
# its input-derived runtime ID changes; this ordinary app build never rebuilds or bundles it.

on:
  workflow_dispatch: {}
  workflow_call: # called by desktop-shell-release.yml on a pushed version tag; branch-push path below unaffected
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
  push:
    branches: [main]
    paths:
      - "app/desktop-shell/**"
      - "app/backend/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/desktop-shell-windows.yml"

concurrency:
  # A hardcoded literal, not ${{ github.workflow }} -- when called via workflow_call from
  # desktop-shell-release.yml, github.workflow can resolve to the CALLER's name, which would collide all
  # three platforms' concurrency groups and cancel each other out via cancel-in-progress.
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-shell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: "Guard: on a tag push, the tag version must match tauri.conf.json/Cargo.toml/package.json"
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -e
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CONF=$(jq -r '.version' app/desktop-shell/src-tauri/tauri.conf.json)
          CARGO=$(grep -m1 '^version' app/desktop-shell/src-tauri/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          PKG=$(jq -r '.version' app/desktop-shell/package.json)
          if [ "$TAG_VERSION" != "$CONF" ] || [ "$TAG_VERSION" != "$CARGO" ] || [ "$TAG_VERSION" != "$PKG" ]; then
            echo "::error::tag v$TAG_VERSION does not match tauri.conf.json=$CONF, Cargo.toml=$CARGO, package.json=$PKG"
            exit 1
          fi
          echo "tag v$TAG_VERSION matches tauri.conf.json/Cargo.toml/package.json"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/desktop-shell/src-tauri
            app/desktop-shell/connector-host

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Verify referenced immutable Python runtime is published
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ID=$(python app/desktop-shell/packaging/package_python_runtime.py id --platform windows-x86_64)
          ASSETS=$(gh release view "python-runtime-$ID" --json assets --jq '.assets[].name')
          grep -Fx "$ID.tar.gz" <<<"$ASSETS"
          grep -Fx "runtime-manifest.json" <<<"$ASSETS"
          grep -Fx "runtime-manifest.json.sig" <<<"$ASSETS"

      - name: Install project dependencies (needed just to import app.backend for build_frontend.py)
        run: uv sync --locked

      - name: Install frontend build toolchain + build callosum-app.html
        run: |
          npm install
          uv run python tools/build_frontend.py

      - name: Stage callosum source into resources/callosum-src
        run: python app/desktop-shell/packaging/stage_source.py

      - name: Generate the connector's NSIS include from connector/identity.json
        run: python app/desktop-shell/packaging/generate_connector_nsh.py

      - name: Build and stage the browser-capture connector host into resources/connector
        run: python app/desktop-shell/packaging/stage_connector.py

      - name: Install Tauri CLI
        working-directory: app/desktop-shell
        run: npm install

      - name: Build the NSIS installer
        working-directory: app/desktop-shell
        env:
          # Present on every build (not just tag-triggered releases) so a broken signing setup is
          # caught on an ordinary commit, not discovered only when a real release is cut. Two real
          # failure modes found by actually running this on a real Windows/macOS runner before the
          # signing secrets existed: (1) GitHub Actions sets the env var to an EMPTY STRING (not
          # absent) when the secret doesn't exist — Tauri's bundler treats "present but empty" as "a
          # key was given" and tries to decode "", failing the whole build. (2) Even with the env
          # vars genuinely absent, tauri.conf.json already has a REAL public key baked in (`plugins.
          # updater.pubkey`) — Tauri then demands a matching private key unconditionally ("A public
          # key has been found, but no private key"), since a pubkey with no private key ever
          # available is treated as a broken config, not "signing is optional here." So: when no key
          # is configured, override bundle.createUpdaterArtifacts to false for this build only (via
          # `-c`, not editing tauri.conf.json) — an honestly-unsigned build with no updater artifact,
          # rather than a hard failure. Once the two secrets are set, this branch stops firing.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            npx tauri build
          } else {
            Write-Host "No signing key configured yet -- building unsigned, no updater artifact"
            npx tauri build -c '{"bundle":{"createUpdaterArtifacts":false}}'
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: callosum-windows-x64
          path: app/desktop-shell/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload updater artifact (the .exe's own .sig — Tauri's NSIS updater signs the installer directly, confirmed via a real run; it does NOT produce a separate .nsis.zip the way some docs describe. The .exe itself is already uploaded above.)
        uses: actions/upload-artifact@v4
        with:
          name: callosum-windows-x64-updater
          path: app/desktop-shell/src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: warn # absent on an unsigned build (a fork's branch-push, no secrets) — not an error there

      - name: "Verify: silent-install the real installer, launch it, screenshot the real running window"
        id: verify
        timeout-minutes: 25
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem "app/desktop-shell/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1

          Write-Host "Running the real installer silently: $($installer.FullName) /S"
          Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait

          $installed = "$env:LOCALAPPDATA\Callosum\callosum-shell.exe"
          if (-not (Test-Path $installed)) { throw "installer did not produce $installed" }

          Write-Host "Launching the installed app for real"
          Start-Process -FilePath $installed

          $ready = $false
          $port = $null
          # A fresh runner intentionally exercises first-use runtime download + verification.
          for ($i = 0; $i -lt 400; $i++) {
            $proc = Get-CimInstance Win32_Process -Filter "Name='python.exe'" |
              Where-Object { $_.CommandLine -match "Callosum.*uvicorn.*--port (\d+)" }
            if ($proc) {
              $port = [regex]::Match($proc.CommandLine, "--port (\d+)").Groups[1].Value
              try {
                $resp = Invoke-WebRequest -Uri "http://127.0.0.1:$port/health" -UseBasicParsing -TimeoutSec 2
                if ($resp.StatusCode -eq 200) { $ready = $true; Write-Host "healthy on port $port after $($i*3)s"; break }
              } catch {}
            }
            Start-Sleep -Seconds 3
          }
          Start-Sleep -Seconds 2  # let the webview actually paint

          # Screenshot the real desktop via .NET — no extra tool/dependency needed on windows-latest.
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bitmap.Save("$env:RUNNER_TEMP\running-window.png")

          if (-not $ready) {
            Write-Host "::error::backend never reported healthy within the wait budget"
          }

          # Verify closing the app actually cleans up the spawned backend (Job Object working).
          Get-Process -Name "callosum-shell" -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3
          $orphan = Get-CimInstance Win32_Process -Filter "Name='python.exe'" |
            Where-Object { $_.CommandLine -match "Callosum.*uvicorn" }
          if ($orphan) {
            Write-Host "::error::backend process survived the shell being killed — Job Object cleanup did not work"
            Stop-Process -Id $orphan.ProcessId -Force -ErrorAction SilentlyContinue
          } else {
            Write-Host "confirmed: no orphaned backend process after killing the shell"
          }
          if (-not $ready -or $orphan) {
            Get-ChildItem "$env:APPDATA" -Filter backend.log -Recurse -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "--- $($_.FullName) ---"; Get-Content $_.FullName -Tail 120 }
            throw "installed Windows application lifecycle verification failed"
          }

      - name: "Verify: browser-capture connector registration is correct after install"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Get-DefaultRegValue($regPath) {
            if (-not (Test-Path $regPath)) { throw "$regPath was not created by the installer" }
            $value = (Get-Item -LiteralPath $regPath).GetValue("")
            if ([string]::IsNullOrEmpty($value)) { throw "$regPath has no default value" }
            return $value
          }

          foreach ($browserKey in @("Google\Chrome", "Microsoft\Edge")) {
            $regPath = "HKCU:\Software\$browserKey\NativeMessagingHosts\org.callosum.connector"
            $manifestPath = Get-DefaultRegValue $regPath
            Write-Host "$browserKey -> $manifestPath"
            if (-not (Test-Path $manifestPath)) { throw "manifest does not exist at $manifestPath" }
            $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
            if ($manifest.name -ne "org.callosum.connector") { throw "unexpected manifest name: $($manifest.name)" }
            if ($manifest.type -ne "stdio") { throw "unexpected manifest type: $($manifest.type)" }
            if (-not (Test-Path $manifest.path)) { throw "manifest 'path' does not resolve to a real file: $($manifest.path)" }
            # allowed_origins is deliberately EMPTY pending real Chrome Web Store / Edge Add-ons
            # publication (see connector/identity.json's own comment on why). This asserts the
            # installer threads whatever identity.json is CONFIGURED with, not a specific real id --
            # there isn't one yet, and there won't be one until this extension is actually published.
            if (@($manifest.allowed_origins).Count -ne 0) {
              throw "expected an empty allowed_origins (unpublished extension); got: $($manifest.allowed_origins -join ',')"
            }
          }
          Write-Host "connector registration verified for Chrome and Edge"

      - name: "Verify: update-mode uninstall preserves connector registration; ordinary uninstall removes it"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installDir = "$env:LOCALAPPDATA\Callosum"
          $uninstaller = "$installDir\uninstall.exe"
          if (-not (Test-Path $uninstaller)) { throw "uninstaller not found at $uninstaller" }

          $chromeKey = "HKCU:\Software\Google\Chrome\NativeMessagingHosts\org.callosum.connector"
          $edgeKey = "HKCU:\Software\Microsoft\Edge\NativeMessagingHosts\org.callosum.connector"

          # Pre-seed an unrelated third-party entry to prove neither uninstall path below ever
          # touches a NativeMessagingHosts sibling registered under a different name.
          $thirdPartyKey = "HKCU:\Software\Google\Chrome\NativeMessagingHosts\com.example.thirdparty"
          New-Item -Path $thirdPartyKey -Force | Out-Null
          Set-ItemProperty -Path $thirdPartyKey -Name "(default)" -Value "C:\not-callosum\manifest.json"

          # These exact arguments are not a guess: extracted from the actual NSIS template embedded
          # in @tauri-apps/cli-win32-x64-msvc. The installer, when itself launched with /UPDATE by
          # tauri-plugin-updater, re-invokes the OLD version's "$INSTDIR\uninstall.exe" with /UPDATE
          # appended (plus /P, since this app's updater.windows.installMode is "passive") before the
          # new version's files land. /S is added purely for CI unattendedness; it does not change
          # $UpdateMode. _?=$INSTDIR makes the uninstaller run in place and synchronously, so -Wait
          # actually waits for completion rather than for a self-copy-and-relaunch stub.
          Write-Host "Running update-mode uninstall: $uninstaller /S /UPDATE _?=$installDir"
          Start-Process -FilePath $uninstaller -ArgumentList "/S", "/UPDATE", "_?=$installDir" -Wait

          if (-not (Test-Path $chromeKey)) { throw "update-mode uninstall removed the Chrome connector key -- the /UPDATE guard is broken" }
          if (-not (Test-Path $edgeKey)) { throw "update-mode uninstall removed the Edge connector key -- the /UPDATE guard is broken" }
          Write-Host "confirmed: update-mode uninstall preserved both connector registry keys"

          Write-Host "Running ordinary uninstall: $uninstaller /S _?=$installDir"
          Start-Process -FilePath $uninstaller -ArgumentList "/S", "_?=$installDir" -Wait

          if (Test-Path $chromeKey) { throw "ordinary uninstall left the Chrome connector key behind" }
          if (Test-Path $edgeKey) { throw "ordinary uninstall left the Edge connector key behind" }
          Write-Host "confirmed: ordinary uninstall removed both connector registry keys"

          if (-not (Test-Path $thirdPartyKey)) { throw "ordinary uninstall deleted an unrelated third-party NativeMessagingHosts entry -- the ownership check is broken" }
          if ((Get-Item -LiteralPath $thirdPartyKey).GetValue("") -ne "C:\not-callosum\manifest.json") {
            throw "third-party NativeMessagingHosts entry's value was modified"
          }
          Write-Host "confirmed: third-party NativeMessagingHosts entry survived untouched"
          Remove-Item -Path $thirdPartyKey -Force -ErrorAction SilentlyContinue

      - name: Upload verification screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: callosum-windows-verification
          path: ${{ runner.temp }}\running-window.png
          if-no-files-found: warn
