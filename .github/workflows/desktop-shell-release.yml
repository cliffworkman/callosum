name: Desktop shell (release)

# Fires only on a pushed version tag (vX.Y.Z) -- the deliberate "cut a release" act. Calls the three
# existing platform workflows as reusable workflows (their own build/verify logic is untouched, not
# duplicated), then -- only if all three succeed -- publishes ONE GitHub Release for the tag with all
# three installers attached. An ordinary push to main never reaches this file at all; the branch-push
# path in desktop-shell-{windows,macos,linux}.yml is completely unaffected by this addition.
#
# Deliberately no `paths:` filter here: GitHub's paths filter diffs commits since the last matching push,
# which is unreliable for a tag pushed after its commit already landed on main via the normal branch push
# -- a pushed tag is already the deliberate act, so this trigger is intentionally unconditional.

on:
  push:
    tags: ["v*"]

jobs:
  build-windows:
    uses: ./.github/workflows/desktop-shell-windows.yml
    secrets: inherit # the TAURI_SIGNING_* pair, so this platform's updater artifact gets signed

  build-macos:
    uses: ./.github/workflows/desktop-shell-macos.yml
    secrets: inherit # same as above

  build-linux:
    uses: ./.github/workflows/desktop-shell-linux.yml
    # No secrets needed: Linux has no silent auto-update path (see updater.rs's header comment) —
    # nothing here is ever signed.

  publish:
    # Only runs once all three platforms have actually succeeded -- never publishes a partial release.
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the repo's default GITHUB_TOKEN is read-only; this is the one job that needs write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: callosum-windows-x64
          path: dist/windows

      - uses: actions/download-artifact@v4
        with:
          name: callosum-macos-arm64
          path: dist/macos-arm64

      - uses: actions/download-artifact@v4
        with:
          name: callosum-macos-x64
          path: dist/macos-x64

      - uses: actions/download-artifact@v4
        with:
          name: callosum-linux-x86_64
          path: dist/linux

      - uses: actions/download-artifact@v4
        continue-on-error: true # absent if the signing secrets aren't set yet — see the latest.json step below
        with:
          name: callosum-windows-x64-updater
          path: dist/windows

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: callosum-macos-arm64-updater
          path: dist/macos-arm64

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: callosum-macos-x64-updater
          path: dist/macos-x64

      - name: Read the annotated tag's own message as the release body
        id: tagmsg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # `git tag -l --format='%(contents)'` against the local checkout returned the LAST COMMIT's message,
          # not the annotated tag's own message (confirmed live on v0.3.0 and v0.3.1 -- the exact runner-side
          # mechanism was never pinned down, but the GitHub API confirms the tag object itself is correct on
          # GitHub's side). Querying the API directly is authoritative and sidesteps whatever actions/checkout
          # does locally with tag refs, instead of trusting local git state a second time.
          tag_json=$(gh api "repos/${{ github.repository }}/git/refs/tags/${{ github.ref_name }}")
          obj_type=$(echo "$tag_json" | jq -r '.object.type')
          obj_sha=$(echo "$tag_json" | jq -r '.object.sha')
          if [ "$obj_type" = "tag" ]; then
            body=$(gh api "repos/${{ github.repository }}/git/tags/$obj_sha" --jq '.message')
          else
            # A lightweight tag (not how this project's release ritual creates tags) -- fall back to the
            # commit message rather than fail the whole release.
            body=$(gh api "repos/${{ github.repository }}/git/commits/$obj_sha" --jq '.message')
          fi
          {
            echo 'body<<CALLOSUM_RELEASE_BODY_EOF'
            echo "$body"
            echo 'CALLOSUM_RELEASE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Stage uniquely named release assets
        run: |
          set -e
          mkdir release
          cp dist/windows/*.exe release/
          cp dist/windows/*.exe.sig release/ 2>/dev/null || true
          cp dist/macos-arm64/*.dmg release/
          cp dist/macos-arm64/*.app.tar.gz release/ 2>/dev/null || true
          cp dist/macos-arm64/*.app.tar.gz.sig release/ 2>/dev/null || true
          cp dist/macos-x64/*.dmg release/
          cp dist/macos-x64/*.app.tar.gz release/ 2>/dev/null || true
          cp dist/macos-x64/*.app.tar.gz.sig release/ 2>/dev/null || true
          cp dist/linux/*.deb release/

      - name: "Build latest.json for the in-app auto-updater (Windows/macOS only — see updater.rs for why Linux has no silent-update path). Gracefully skipped, not a release-blocking failure, if the updater artifacts are missing — e.g. before Cliff has set the two TAURI_SIGNING_* repo secrets. Runs BEFORE the alias-creation step below so release/*.exe unambiguously matches the one real, versioned installer (the alias copy doesn't exist yet)."
        env:
          NOTES: ${{ steps.tagmsg.outputs.body }}
        run: |
          set -e
          # Confirmed via a real signed run: Tauri's NSIS updater signs the installer .exe directly —
          # there is no separate .nsis.zip artifact (despite some docs describing one).
          WIN_EXE=$(ls release/*.exe 2>/dev/null | head -1 || true)
          WIN_SIG=$(ls release/*.exe.sig 2>/dev/null | head -1 || true)
          MAC_ARM_TGZ=$(ls release/*_aarch64.app.tar.gz 2>/dev/null | head -1 || true)
          MAC_ARM_SIG=$(ls release/*_aarch64.app.tar.gz.sig 2>/dev/null | head -1 || true)
          MAC_X64_TGZ=$(ls release/*_x86_64.app.tar.gz 2>/dev/null | head -1 || true)
          MAC_X64_SIG=$(ls release/*_x86_64.app.tar.gz.sig 2>/dev/null | head -1 || true)
          if [ -z "$WIN_EXE" ] || [ -z "$WIN_SIG" ] || \
             [ -z "$MAC_ARM_TGZ" ] || [ -z "$MAC_ARM_SIG" ] || \
             [ -z "$MAC_X64_TGZ" ] || [ -z "$MAC_X64_SIG" ]; then
            echo "::warning::updater artifacts missing (TAURI_SIGNING_PRIVATE_KEY/_PASSWORD repo secrets not set yet?) — this release will publish WITHOUT latest.json, so the in-app auto-updater won't see it. Set the two secrets, then the next release will include it automatically."
            exit 0
          fi
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          jq -n \
            --arg version "$TAG_VERSION" \
            --arg notes "$NOTES" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg win_url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$(basename "$WIN_EXE")" \
            --arg win_sig "$(cat "$WIN_SIG")" \
            --arg mac_arm_url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$(basename "$MAC_ARM_TGZ")" \
            --arg mac_arm_sig "$(cat "$MAC_ARM_SIG")" \
            --arg mac_x64_url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$(basename "$MAC_X64_TGZ")" \
            --arg mac_x64_sig "$(cat "$MAC_X64_SIG")" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {
               "windows-x86_64": {signature: $win_sig, url: $win_url},
               "darwin-aarch64": {signature: $mac_arm_sig, url: $mac_arm_url},
               "darwin-x86_64": {signature: $mac_x64_sig, url: $mac_x64_url}
            }}' > release/latest.json
          echo "wrote release/latest.json for $TAG_VERSION"

      - name: Create version-independent aliases (Tauri bakes the version into each installer's own
          filename, so a direct .../releases/latest/download/<file> link would silently 404 on the
          next release without these stable-named copies alongside the real, versioned assets)
        run: |
          cp release/*.exe release/Callosum-windows-x64-setup.exe
          cp release/*_aarch64.dmg release/Callosum-macos-arm64.dmg
          cp release/*_x86_64.dmg release/Callosum-macos-x64.dmg
          cp release/*.deb release/Callosum-linux-amd64.deb

      - name: Publish the GitHub Release
        # SHA-pinned (not the mutable @v2 tag) since this step runs with contents: write.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: Callosum ${{ github.ref_name }}
          body: ${{ steps.tagmsg.outputs.body }}
          generate_release_notes: true
          files: release/**
