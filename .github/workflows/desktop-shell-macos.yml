name: Desktop shell (macOS)

# Builds the Tauri desktop shell's macOS .dmg — arm64-only (see app/desktop-shell's increment notes
# for why Intel Macs are out of scope for now) — and then actually verifies it on the runner's real
# macOS session: mounts the real .dmg, installs it, tags it with a quarantine attribute (simulating a
# real "downloaded from the internet" file, since GitHub's own build step doesn't apply one), checks
# what Gatekeeper actually does with an unsigned app, gets past it, and screenshots the real running
# window once the backend is healthy. This is the closest thing to a human click-through available
# without real Mac hardware — real WindowServer session, real screenshots, real Gatekeeper behavior —
# but it is still not a human's eyes on the screen; treat the uploaded screenshots as evidence to
# review, not as a substitute for actually trying the installer yourself.
#
# Not on push/PR — this is a slow, heavy build (portable CPython + the full ML dependency tree) that
# doesn't need to run on every commit. Trigger manually or when the shell/packaging itself changes.

on:
  workflow_dispatch: {}
  workflow_call: # called by desktop-shell-release.yml on a pushed version tag; branch-push path below unaffected
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
  push:
    branches: [main]
    paths:
      - "app/desktop-shell/**"
      - "app/backend/**"
      - "requirements.txt"
      - ".github/workflows/desktop-shell-macos.yml"

concurrency:
  # A hardcoded literal, not ${{ github.workflow }} -- when called via workflow_call from
  # desktop-shell-release.yml, github.workflow can resolve to the CALLER's name, which would collide all
  # three platforms' concurrency groups and cancel each other out via cancel-in-progress.
  group: desktop-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos-shell:
    runs-on: macos-latest # Apple Silicon (arm64) as of this writing
    steps:
      - uses: actions/checkout@v5

      - name: "Guard: on a tag push, the tag version must match tauri.conf.json/Cargo.toml/package.json"
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -e
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CONF=$(jq -r '.version' app/desktop-shell/src-tauri/tauri.conf.json)
          CARGO=$(grep -m1 '^version' app/desktop-shell/src-tauri/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          PKG=$(jq -r '.version' app/desktop-shell/package.json)
          if [ "$TAG_VERSION" != "$CONF" ] || [ "$TAG_VERSION" != "$CARGO" ] || [ "$TAG_VERSION" != "$PKG" ]; then
            echo "::error::tag v$TAG_VERSION does not match tauri.conf.json=$CONF, Cargo.toml=$CARGO, package.json=$PKG"
            exit 1
          fi
          echo "tag v$TAG_VERSION matches tauri.conf.json/Cargo.toml/package.json"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts (this build takes ~4-5 min cold; iteration on the verify
          steps below shouldn't pay that twice)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/desktop-shell/src-tauri

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install project dependencies (needed just to import app.backend for build_frontend.py)
        run: uv sync --locked

      - name: Install frontend build toolchain + build callosum-app.html
        run: |
          npm install
          uv run python tools/build_frontend.py

      - name: Stage callosum source into resources/callosum-src
        run: python3 app/desktop-shell/packaging/stage_source.py

      - name: "Build portable Python runtime + install real deps + smoke test (arm64, REQUIRED — blocking)"
        run: bash app/desktop-shell/packaging/build_python_macos.sh

      - name: Install Tauri CLI
        working-directory: app/desktop-shell
        run: npm install

      - name: Build the .app (dmg wrapping happens after re-signing below)
        working-directory: app/desktop-shell
        env:
          # Present on every build, same reasoning as the Windows workflow. Tauri's own
          # createUpdaterArtifacts packaging (tauri.conf.json) would sign a .app.tar.gz here too, but
          # it isn't trusted — see the next step, which regenerates it AFTER the re-sign below instead,
          # since it's unconfirmed whether Tauri's own packaging step runs before or after
          # bundle.resources is copied in (the exact ordering bug the re-sign step already exists to
          # fix once). Two real failure modes found by actually running this before the signing
          # secrets existed: (1) GitHub Actions sets these to an EMPTY STRING (not absent) when the
          # secret doesn't exist — Tauri treats "present but empty" as "a key was given" and fails
          # trying to decode "". (2) tauri.conf.json already has a REAL public key baked in — even
          # with the env vars genuinely absent, Tauri demands a matching private key unconditionally
          # ("A public key has been found, but no private key"). So when unsigned, override
          # bundle.createUpdaterArtifacts to false for this build only (via `-c`, not editing
          # tauri.conf.json) — an honestly-unsigned build, not a hard failure. Stops firing once the
          # two secrets are set.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build
          else
            echo "No signing key configured yet -- building unsigned, no updater artifact"
            npx tauri build -c '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      - name: "Re-sign the .app AFTER resources are bundled (real run found the default ad-hoc sign happens before bundle.resources is copied in, leaving spctl reporting \"code has no resources but signature indicates they must be present\" — Gatekeeper then reports the app as \"damaged\" instead of the milder unidentified-developer warning)"
        run: |
          set -x
          APP=$(find app/desktop-shell/src-tauri/target/release/bundle/macos -maxdepth 1 -name "*.app")
          codesign --force --deep --sign - "$APP"
          echo "--- spctl assessment of the freshly re-signed .app (no quarantine yet) ---"
          spctl -a -vvv "$APP" 2>&1 || true

      - name: "Regenerate the updater artifact from the correctly-resigned .app (skipped gracefully if unsigned; don't trust Tauri's own createUpdaterArtifacts output either way — its sequencing relative to the resign step above is unconfirmed)"
        working-directory: app/desktop-shell
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -x
          # The `secrets` context can't be referenced in a step `if:` (a GitHub Actions parse-time
          # restriction — "Unrecognized named-value: 'secrets'"), so the skip check lives here instead.
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY not set — skipping the updater-artifact regen (unsigned build, no repo secrets configured yet)"
            exit 0
          fi
          # A real run found createUpdaterArtifacts:true also produces its OWN auto-signed
          # Callosum.app.tar.gz(.sig) (no version/arch in the name) alongside this one — since
          # that's the untrusted artifact this whole step exists to not rely on, delete it here so
          # the "Upload updater artifact" step's glob below can only ever find the trusted one.
          rm -f src-tauri/target/release/bundle/macos/Callosum.app.tar.gz \
                src-tauri/target/release/bundle/macos/Callosum.app.tar.gz.sig
          APP=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name "*.app")
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          ARTIFACT="src-tauri/target/release/bundle/macos/Callosum_${VERSION}_aarch64.app.tar.gz"
          tar -czf "$ARTIFACT" -C "$(dirname "$APP")" "$(basename "$APP")"
          npx tauri signer sign "$ARTIFACT"

      - name: Wrap the re-signed .app into a .dmg
        run: |
          APP=$(find app/desktop-shell/src-tauri/target/release/bundle/macos -maxdepth 1 -name "*.app")
          VERSION=$(jq -r '.version' app/desktop-shell/src-tauri/tauri.conf.json)
          mkdir -p app/desktop-shell/src-tauri/target/release/bundle/dmg
          hdiutil create -volname "Callosum" -srcfolder "$APP" -ov -format UDZO \
            "app/desktop-shell/src-tauri/target/release/bundle/dmg/Callosum_${VERSION}_aarch64.dmg"

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: callosum-macos-arm64
          path: app/desktop-shell/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload updater artifact (signed .app.tar.gz + .sig, for the in-app auto-updater)
        uses: actions/upload-artifact@v4
        with:
          name: callosum-macos-arm64-updater
          path: |
            app/desktop-shell/src-tauri/target/release/bundle/macos/*.app.tar.gz
            app/desktop-shell/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: warn # absent on an unsigned build (a fork's branch-push, no secrets) — not an error there

      - name: "Verify: mount the real .dmg, simulate Gatekeeper, screenshot the real running window"
        id: verify
        timeout-minutes: 10 # a real run showed `open` on a quarantined app can hang indefinitely
        # waiting on a Gatekeeper dialog nobody can click in headless CI — see the backgrounded
        # `open` calls below for the actual fix; this is a defense-in-depth ceiling on top of it.
        run: |
          set -x
          DMG=$(ls app/desktop-shell/src-tauri/target/release/bundle/dmg/*.dmg)
          MOUNT=/tmp/callosum-mount
          mkdir -p "$MOUNT"
          hdiutil attach "$DMG" -nobrowse -mountpoint "$MOUNT"

          APP_SRC=$(find "$MOUNT" -maxdepth 1 -name "*.app")
          APP_NAME=$(basename "$APP_SRC")
          cp -R "$APP_SRC" /Applications/
          hdiutil detach "$MOUNT"
          INSTALLED="/Applications/$APP_NAME"

          # GitHub's own checkout/build never applies a quarantine flag, but a real download (email,
          # Slack, a browser) does -- tag it manually so this test faces the same Gatekeeper posture
          # the labmate actually will, not the more lenient "locally built" posture.
          xattr -w com.apple.quarantine "0083;$(printf '%08x' "$(date +%s)");Google Chrome;" "$INSTALLED"

          echo "--- spctl assessment WITH quarantine (what a fresh download looks like) ---"
          spctl -a -vvv "$INSTALLED" 2>&1 | tee /tmp/spctl-quarantined.log || true

          echo "--- attempting a plain 'open' (~ a real double-click) while quarantined ---"
          # Backgrounded deliberately: a real run showed a plain foreground `open` on a quarantined,
          # unsigned app hang for 25+ minutes — `open` normally returns immediately, but here it
          # appears to block on the Gatekeeper dialog itself, which nobody is present to click in a
          # headless CI shell. Backgrounding means the script keeps moving regardless of whether/how
          # that dialog ever resolves; pgrep below still tells us whether the app actually launched.
          open "$INSTALLED" &
          disown
          sleep 6
          # plain screencapture hit macOS's Screen Recording TCC permission wall on a real run
          # (captured a permission-request dialog instead of the real window) -- try sudo first,
          # since root sometimes has a separate, already-granted TCC profile on these runners.
          sudo screencapture -x /tmp/1-after-open-while-quarantined.png || screencapture -x /tmp/1-after-open-while-quarantined.png || true
          if pgrep -f "$APP_NAME" >/dev/null; then
            echo "UNEXPECTED: process launched despite quarantine"
          else
            echo "CONFIRMED: Gatekeeper blocked the plain-open attempt, as FIRST-LAUNCH-NOTE.md describes"
          fi

          # The documented workaround is Finder's right-click -> Open, which clears the OS's distrust
          # of this specific file the same way removing the quarantine attribute does; this is the
          # closest scriptable proxy to that gesture available in a non-interactive CI shell.
          xattr -d com.apple.quarantine "$INSTALLED"
          echo "--- spctl assessment AFTER the trust override ---"
          spctl -a -vvv "$INSTALLED" 2>&1 | tee /tmp/spctl-trusted.log || true

          open "$INSTALLED" &
          disown
          echo "--- waiting for the real backend to report healthy ---"
          ready=0
          for i in $(seq 1 40); do
            PORT=$(ps aux | grep -oE "uvicorn app\.backend\.api\.app:app --host 127\.0\.0\.1 --port [0-9]+" | grep -oE "[0-9]+$" | head -1 || true)
            if [ -n "$PORT" ] && [ "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PORT/health" || true)" = "200" ]; then
              echo "healthy on port $PORT after $((i*3))s"
              ready=1
              break
            fi
            sleep 3
          done
          sleep 2 # give the webview a moment to actually paint the loaded page
          sudo screencapture -x /tmp/2-running-window.png || screencapture -x /tmp/2-running-window.png || true
          if [ "$ready" != "1" ]; then
            echo "::warning::backend never reported healthy within the wait budget — screenshot may show only the splash"
          fi

          pkill -f "$APP_NAME" || true

      - name: Upload verification screenshots + Gatekeeper logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: callosum-macos-verification
          path: |
            /tmp/1-after-open-while-quarantined.png
            /tmp/2-running-window.png
            /tmp/spctl-quarantined.log
            /tmp/spctl-trusted.log
          if-no-files-found: warn
