[project]
name = "callosum"
version = "0.1.0"
description = "Local-first reference manager persistence core."
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    # Pin the web stack exactly. Bumped to fastapi 0.139.2 + starlette 1.3.1 to clear 14 Dependabot advisories on
    # starlette (6 high; a high covers the whole `>=0.4.1,<1.3.1` range, so 1.3.1 is the floor — see the security
    # audit 2026-07-19_web-stack-cve-migration.md). Bump fastapi + starlette together deliberately (fastapi 0.115
    # caps starlette <0.46, so no patched starlette fits the old fastapi).
    "fastapi==0.139.2",
    "starlette==1.3.1",
    "httpx>=0.27,<1",
    "lxml>=5,<7", # local CSL 1.0.2 Relax NG + Schematron validation (inc 369)
    "pymupdf>=1.24,<2",
    # Floor is 4, not 3: model_runtime.py's CrossEncoder construction passes backend=, a kwarg
    # CrossEncoder.__init__ only accepts from sentence-transformers v4 onward.
    "sentence-transformers>=4,<6",
    "sqlite-vec>=0.1,<1",
    "scikit-learn>=1.4,<2",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2", # statcheck p-value recomputation (inc 95); already present transitively via scikit-learn
    "google-genai>=1,<2",
    "uvicorn[standard]>=0.30,<1",
    # Optional-account sign-in (ORCID via OIDC): id-token verification (JWKS signature + iss/aud/exp).
    # Lazy-imported in app/backend/api/auth/oidc.py — the app + hermetic suite run without it.
    "pyjwt[crypto]>=2.8,<3",
]

[project.optional-dependencies]
# Optional (inc 152): OS-keychain storage for BYOK provider API keys (Windows Credential Manager / macOS
# Keychain / Linux Secret Service) instead of the local settings-file fallback.
keyring = ["keyring>=24"]

[dependency-groups]
# The dev/CI toolchain. `uv sync` installs this group by default (see [tool.uv] below).
# requirements-dev.txt mirrors this list for pip-only workflows; keep the two in sync by hand.
dev = [
    # pip-audit flags PYSEC-2026-1845 on 8.4.2 (fixed 9.0.3) — ACCEPTED, dev-tool-only; see the matching
    # comment in requirements-dev.txt and .claude/security-audits/2026-06-20_pre-github-fullsweep.md (addendum).
    "pytest>=7.4,<9",
    "pytest-xdist>=3", # parallel test runner (`pytest -n auto`) — cuts full-suite wall-clock ~3-4x (inc 300)
    "pytest-testmon>=2", # change-based selection (`pytest --testmon`) (inc 300)
    "httpx2>=2,<3", # starlette 1.x (inc 305) prefers httpx2 under TestClient; dev/test-only
    # Pin ruff EXACTLY: its 0.x minor releases change lint/format behavior (an unpinned range once let CI grab
    # a newer minor that flagged import-ordering the dev version accepted → red CI). Bump deliberately.
    "ruff==0.9.6",
    "bandit>=1.8,<2", # hosted feedback relay activates the staged Python security scan (inc 439)
    "pip-audit>=2.7",
    "pre-commit>=4",
    "playwright>=1.40",
    "pytest-playwright>=0.5",
    "mcp>=1.2", # mcp_server SP1 — to run tests/test_mcp_server.py (B1); a server-only runtime dep, dev-side here
    "tach>=0.35", # module-boundary contracts (staged-harnesses/tach.md) — activated inc 472, the first outside
    # contributor's own trigger firing (Jeffrey Vadala, tui/ PR #1)
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# F = pyflakes (unused imports/vars, undefined names — the dead-code signal); E/W = pycodestyle;
# I = import sorting; B = bugbear. E501 (line length) is the formatter's job, not a lint failure.
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts these callables in argument defaults on purpose;
# B008 ("function call in default argument") is a false positive for them.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.File",
    "fastapi.Form",
]

[tool.bandit]
exclude_dirs = ["tests", "tools", ".venv"]
# Internal asserts express invariants; request validation uses Pydantic/FastAPI boundaries instead.
skips = ["B101"]
