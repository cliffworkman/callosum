[project]
name = "callosum"
version = "0.1.0"
description = "Local-first reference manager persistence core."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "google-genai>=1,<2",
    "httpx>=0.27,<1",
    "pymupdf>=1.24,<2",
    "scikit-learn>=1.4,<2",
    "sentence-transformers>=3,<6",
    "sqlite-vec>=0.1,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "httpx2>=2,<3",
    "pytest>=7.4,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# F = pyflakes (unused imports/vars, undefined names — the dead-code signal); E/W = pycodestyle;
# I = import sorting; B = bugbear. E501 (line length) is the formatter's job, not a lint failure.
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts these callables in argument defaults on purpose;
# B008 ("function call in default argument") is a false positive for them.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.File",
    "fastapi.Form",
]
