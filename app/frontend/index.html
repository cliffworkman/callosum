  /* No-flash theme bootstrap (inc 46): set data-theme on <html> before paint, from the saved
     preference, else the OS preference. The Settings toggle later updates the same attribute + storage. */
  (function () {
    try {
      var t = localStorage.getItem("callosum.theme");
      if (t !== "light" && t !== "dark") {
        t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
  })();
</script>
