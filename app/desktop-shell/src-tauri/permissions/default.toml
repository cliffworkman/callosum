[[permission]]
identifier = "allow-retry-backend"
description = "Allows retrying backend startup after a failure (the splash screen's Retry button)."
commands.allow = ["retry_backend"]

[[permission]]
identifier = "allow-install-update-now"
description = "Allows installing an already-downloaded update and restarting (Windows/macOS)."
commands.allow = ["install_update_now"]

[[permission]]
identifier = "allow-open-release-page"
description = "Allows opening the GitHub release page in the system browser (Linux update fallback)."
commands.allow = ["open_release_page"]

[[permission]]
identifier = "allow-check-for-updates-now"
description = "Allows checking for updates on demand (Settings > Account & sync > Desktop app)."
commands.allow = ["check_for_updates_now"]

[[permission]]
identifier = "allow-start-word-https-companion"
description = "Allows the packaged Settings window to start its explicitly enabled local Word HTTPS companion."
commands.allow = ["start_word_https_companion"]

[[permission]]
identifier = "allow-stop-word-https-companion"
description = "Allows the packaged Settings window to stop its app-owned local Word HTTPS companion."
commands.allow = ["stop_word_https_companion"]

[[permission]]
identifier = "allow-quick-tunnel-status"
description = "Allows the packaged Settings window to inspect its app-owned Quick Tunnel process."
commands.allow = ["quick_tunnel_status"]

[[permission]]
identifier = "allow-start-quick-tunnel"
description = "Allows an explicit packaged Settings action to start an authenticated Quick Tunnel."
commands.allow = ["start_quick_tunnel"]

[[permission]]
identifier = "allow-stop-quick-tunnel"
description = "Allows the packaged Settings window to stop its app-owned Quick Tunnel process."
commands.allow = ["stop_quick_tunnel"]

[default]
description = "Default permissions for callosum-shell's own commands: backend retry + the auto-updater's manual-check/install/release-page actions."
permissions = [
  "allow-retry-backend",
  "allow-install-update-now",
  "allow-open-release-page",
  "allow-check-for-updates-now",
  "allow-start-word-https-companion",
  "allow-stop-word-https-companion",
  "allow-quick-tunnel-status",
  "allow-start-quick-tunnel",
  "allow-stop-quick-tunnel",
]
